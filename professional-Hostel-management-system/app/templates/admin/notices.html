{% extends 'base.html' %}{% block title %}Notices | HostelHub{% endblock %}{% block heading %}Notices{% endblock %}{% block content %}<div class="grid two"><div class="card form-card"><h3 style="margin-bottom:18px">Publish Announcement</h3><form method="post"><div class="field"><label>Title</label><input name="title" required></div><div class="field"><label>Priority</label><select name="priority"><option>Normal</option><option>High</option></select></div><div class="field"><label>Message</label><textarea name="content" rows="6" required></textarea></div><button class="btn yellow">Publish Notice</button></form></div><div class="card section"><div class="section-head"><h3>Published Notices</h3></div>{% for n in notices %}<div class="notice"><div style="display:flex;justify-content:space-between"><strong>{{n.title}}</strong><span class="badge {% if n.priority=='High' %}yellow{% endif %}">{{n.priority}}</span></div><p>{{n.content}}</p></div>{% else %}<div class="empty">No notices.</div>{% endfor %}</div></div>{% endblock %}
